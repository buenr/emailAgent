commands:
  install: cd web && npm install
  typecheck: cd web && npx tsc --noEmit
  build: cd web && npm run build
  test: echo "No automated test suite configured yet"
  lint: cd web && npm run lint

services:
  backend:
    start: cd "/mnt/c/users/RNA/Documents/Python Scripts/Email_Tagging_UI" && .venv/bin/python run_api.py
    stop: lsof -ti :8000 | xargs kill 2>/dev/null || true
    healthcheck: curl -sf http://localhost:8000/api/health
    port: 8000
    depends_on: []

  frontend:
    start: cd "/mnt/c/users/RNA/Documents/Python Scripts/Email_Tagging_UI/web" && npm run dev
    stop: lsof -ti :3000 | xargs kill 2>/dev/null || true
    healthcheck: curl -sf http://localhost:3000
    port: 3000
    depends_on: [backend]
